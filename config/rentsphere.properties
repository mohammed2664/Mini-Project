# RentSphere Enterprise Configuration
# Institution: Goa University - MCA Object-Oriented Technology Lab

app.name=RentSphere P2P Engine
app.version=1.0.0
app.environment=production

# Server Settings
server.port=8080
server.host=0.0.0.0
server.contextPath=/

# Persistence & Storage (Zero Database Flat Files)
storage.dataDir=data
storage.assetsFile=data/assets_ledger.txt
storage.lockerGridFile=data/locker_grid_8x8.txt
storage.escrowVaultFile=data/escrow_vault.txt
storage.auditWalFile=data/audit_wal.txt
storage.autoFlush=true

# Smart Locker Grid Dimensions & Rules
locker.grid.rows=8
locker.grid.cols=8
locker.grid.totalBays=64
locker.heavyAgri.allowedRow=7

# Escrow Vault Defaults
escrow.platformFeePercentage=5.0
escrow.minSecurityCollateral=500.00
escrow.quarantineHoldDurationHours=24
